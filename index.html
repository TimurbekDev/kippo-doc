        <h1>Kippo — Telegram Bot Framework for C# &amp; .NET</h1>
        <p>
          Kippo is a lightweight, attribute-based framework for building Telegram bots in C# and
          .NET. It ships attribute routing (<code>[Command]</code>, <code>[Text]</code>,
          <code>[CallbackQuery]</code>), session management, multi-step scenes and conversations,
          a middleware pipeline, keyboard builders, flood control, webhooks, and first-class unit
          testing — all native to ASP.NET Core dependency injection.
        </p>
        <p>Install with <code>dotnet add package Kippo</code>.</p>
